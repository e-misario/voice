# Configuración de Nginx Gateway para voice.e-misario.com y sus subdominios
server {
    listen 80;
    server_name voice.e-misario.com *.voice.e-misario.com vioce.e-misario.com localhost;

    client_max_body_size 50M;

    # Preservar headers de Cloudflare y geolocalización
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-IPCountry $http_cf_ipcountry;
    proxy_set_header X-Tenant-ID $http_x_tenant_id;

    # Enrutamiento Backend API
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 180s;
    }

    # Documentación Swagger / OpenAPI
    location /docs {
        proxy_pass http://backend:8000/docs;
    }
    location /redoc {
        proxy_pass http://backend:8000/redoc;
    }
    location /openapi.json {
        proxy_pass http://backend:8000/api/v1/openapi.json;
    }

    # Enrutamiento Frontend Next.js
    location / {
        proxy_pass http://frontend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
