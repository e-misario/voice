services:
  # Base de Datos PostgreSQL Multi-tenant
  postgres:
    image: postgres:16-alpine
    container_name: emisario_voice_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emisario_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emisario_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-emisario_voice_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - emisario_voice_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emisario_admin || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Redis para Colas, Cache y Sesiones
  redis:
    image: redis:7-alpine
    container_name: emisario_voice_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - emisario_voice_net

  # Motor de Audio VoiceStudio (TTS / ASR / Clonación)
  voicestudio:
    build:
      context: .
      dockerfile: Dockerfile.voicestudio
    container_name: emisario_voice_studio
    restart: unless-stopped
    environment:
      - PORT=8880
      - DEVICE=cpu
    volumes:
      - voicestudio_models:/root/.cache/voicestudio
    networks:
      - emisario_voice_net
    ports:
      - "127.0.0.1:8885:8880"

  # Backend FastAPI Multi-tenant
  backend:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
    container_name: emisario_voice_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-emisario_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-emisario_secure_password_2026}
      - POSTGRES_DB=${POSTGRES_DB:-emisario_voice_db}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-emisario_admin}:${POSTGRES_PASSWORD:-emisario_secure_password_2026}@postgres:5432/${POSTGRES_DB:-emisario_voice_db}
      - REDIS_URL=redis://redis:6379/0
      - VOICESTUDIO_API_URL=http://voicestudio:8880
      - SECRET_KEY=${SECRET_KEY:-emisario-super-secret-key-2026-antigravity-voice-ai-jwt-secret}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-k2f7u9z1X3c5v8b0m2n4p6q8r0t2w4y6A8C0E2G4I6K=}
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-voice.e-misario.com}
    depends_on:
      - postgres
      - redis
      - voicestudio
    networks:
      - emisario_voice_net
    ports:
      - "127.0.0.1:8055:8000"

  # Frontend Next.js 14+
  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.frontend
    container_name: emisario_voice_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://voice.e-misario.com/api/v1
    depends_on:
      - backend
    networks:
      - emisario_voice_net
    ports:
      - "127.0.0.1:3055:3000"

  # Nginx Gateway Unificado (Reverse Proxy Frontal para el Túnel)
  gateway:
    image: nginx:alpine
    container_name: emisario_voice_gateway
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:18095:80"
    depends_on:
      - backend
      - frontend
    networks:
      - emisario_voice_net

  # Cloudflare Tunnel Dedicado para voice.e-misario.com
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: emisario_voice_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - emisario_voice_net
    depends_on:
      - gateway

networks:
  emisario_voice_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  voicestudio_models:
